name: Port finding triage

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: GitHub issue number in this repository
        type: string
        required: true
      decision:
        description: Reviewer decision
        type: choice
        options: [false-positive, remediate]
        required: true
      reason:
        description: Reviewer decision rationale
        type: string
        required: true

permissions:
  issues: write

concurrency:
  group: port-dependency-scan-${{ github.repository_id }}
  cancel-in-progress: false

jobs:
  triage:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      NUMBER: ${{ inputs.issue_number }}
      DECISION: ${{ inputs.decision }}
      REASON: ${{ inputs.reason }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Check live issue state
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$NUMBER" =~ ^[1-9][0-9]*$ && "$REASON" =~ [^[:space:]] ]]
          [[ "$DECISION" == false-positive || "$DECISION" == remediate ]]
          issue=$(gh api "repos/$GITHUB_REPOSITORY/issues/$NUMBER")
          jq -e '
            (.pull_request == null) and
            (.user.login | endswith("[bot]")) and
            any(.labels[]; .name == "security-finding") and
            (.body | test("<!-- port-finding:npm-v1:[a-f0-9]{64} -->"))
          ' <<< "$issue" > /dev/null

          assigned=$(jq -r 'any(.assignees[]; .login == "copilot-swe-agent[bot]")' <<< "$issue")
          suppressed=$(jq -r 'any(.labels[]; .name == "security-false-positive")' <<< "$issue")
          state=$(jq -r .state <<< "$issue")

          if [[ "$DECISION" == false-positive ]]; then
            [[ "$assigned" == false ]] || {
              echo "Review and stop the existing agent task before marking false positive."
              exit 1
            }
          else
            [[ "$state" == open && "$suppressed" == false ]] || {
              echo "Only an open, unsuppressed finding can be assigned."
              exit 1
            }
          fi
          echo "assigned=$assigned" >> "$GITHUB_OUTPUT"

      - name: Save false-positive decision and close issue
        if: inputs.decision == 'false-positive'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          endpoint="repos/$GITHUB_REPOSITORY/issues/$NUMBER"
          jq -n '{labels:["security-false-positive"]}' |
            gh api --method POST "$endpoint/labels" --input - > /dev/null
          gh api --method PATCH "$endpoint" -f state=closed -f state_reason=not_planned > /dev/null

      - name: Assign the confirmed issue to Copilot
        if: inputs.decision == 'remediate' && steps.check.outputs.assigned == 'false'
        env:
          GH_TOKEN: ${{ secrets.COPILOT_USER_TOKEN }}
        run: |
          : "${GH_TOKEN:?Configure the approved Copilot user token first}"
          jq -n --arg repo "$GITHUB_REPOSITORY" --arg branch "$DEFAULT_BRANCH" --arg reason "$REASON" '
            {
              assignees: ["copilot-swe-agent[bot]"],
              agent_assignment: {
                target_repo: $repo,
                base_branch: $branch,
                custom_instructions: ("Fix the confirmed dependency advisory. Keep changes scoped, run the relevant tests, and link the issue in the PR. Reviewer context: " + $reason)
              }
            }
          ' | gh api --method POST -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/$GITHUB_REPOSITORY/issues/$NUMBER/assignees" --input - |
            jq -e 'any(.assignees[]; .login == "copilot-swe-agent[bot]")' > /dev/null
